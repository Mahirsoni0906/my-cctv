<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV - Camera Node</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 16px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; background: #34c759; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    video { width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #333; display: none; }
    #logBox { margin-top: 15px; padding: 10px; background: #000; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; color: #34c759; border: 1px solid #333; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2c2c2e; color: #ffd60a; font-family: monospace; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 CCTV Camera</h2>
    <div id="setupArea">
      <input type="text" id="cameraId" placeholder="Choose a Unique Camera ID (e.g. home99)" />
      <input type="password" id="userPass" placeholder="Encryption Password for Vault" />
      <button onclick="activateCCTV()">Start Camera & Live Hub</button>
    </div>

    <video id="preview" autoplay playsinline muted></video>
    <div id="liveBadge" class="badge" style="display:none;"></div>
    <div id="logBox">[Set your camera ID and password to start]</div>
  </div>

  <script>
    // --- CREDENTIALS ---
    const BOT_TOKEN = "8870229096:AAFJSMIBUsWuWTH1v7MyEUdIf8t5ToNHhaQ";
    const CHAT_ID = "-1003997436380";

    let localStream = null;
    let peer = null;
    let activePassword = "";

    function log(msg) {
      const box = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      box.innerHTML += `<div>[${time}] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, buffer);

      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);
      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function sendToVault(fileBlob, filename) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, filename);
      formData.append("caption", `🔒 Vault: ${new Date().toLocaleTimeString()}`);
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: "POST", body: formData });
        log("✅ Encrypted chunk backed up to Telegram.");
      } catch (err) {
        log(`❌ Backup failed: ${err.message}`);
      }
    }

    async function activateCCTV() {
      const camId = document.getElementById("cameraId").value.trim().toLowerCase();
      const pass = document.getElementById("userPass").value;

      if (!camId || !pass || pass.length < 6) {
        alert("Please provide both a Camera ID and a password (min 6 chars).");
        return;
      }
      activePassword = pass;

      document.getElementById("setupArea").style.display = "none";
      log("Requesting camera access...");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: true
        });

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";

        initLiveStreaming(camId);
        startEncryptedStorageLoop();
      } catch (err) {
        log(`Hardware Error: ${err.message}`);
      }
    }

    function initLiveStreaming(camId) {
      log(`Registering live ID: ${camId}...`);
      peer = new Peer(camId);

      peer.on("open", (id) => {
        log(`🟢 Live broadcast ready! ID: ${id}`);
        const badge = document.getElementById("liveBadge");
        badge.innerText = `Camera ID: ${id}`;
        badge.style.display = "inline-block";
      });

      // When viewer phone calls, answer and transmit the camera stream
      peer.on("call", (call) => {
        log("📞 Viewer connecting live...");
        call.answer(localStream);
        call.on("stream", () => {});
      });

      peer.on("error", (err) => {
        log(`Peer Error: ${err.type}`);
      });
    }

    function startEncryptedStorageLoop() {
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8") ? "video/webm;codecs=vp8" : "";
      const recorder = mime ? new MediaRecorder(localStream, { mimeType: mime }) : new MediaRecorder(localStream);

      recorder.ondataavailable = async (e) => {
        if (e.data && e.data.size > 0) {
          log("Encrypting 10s chunk...");
          const encrypted = await encryptBlob(e.data, activePassword);
          await sendToVault(encrypted, `cctv_${Date.now()}.enc`);
        }
      };

      recorder.start(10000); // 10 second chunks
    }
  </script>
</body>
</html>
