<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CCTV - Camera Node</title>
  
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { background: #121214; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 420px; margin: auto; border: 1px solid #333; position: relative; z-index: 1; }
    input[type="text"], input[type="password"] { width: 92%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 15px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-green { background: #34c759; color: white; }
    .btn-red { background: #ff453a; color: white; }
    .btn-dark { background: #2c2c2e; color: #ffd60a; border: 1px solid #444; }
    .btn-link { background: transparent; color: #0a84ff; font-size: 13px; text-decoration: underline; margin-top: 8px; padding: 6px; cursor: pointer; border: none; }
    video { width: 100%; border-radius: 8px; margin-top: 10px; border: 2px solid #333; display: none; background: #000; }
    #logBox { margin-top: 15px; padding: 10px; background: #000; border-radius: 8px; font-family: monospace; font-size: 11px; text-align: left; height: 130px; overflow-y: auto; color: #34c759; border: 1px solid #222; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2c2c2e; color: #ffd60a; font-family: monospace; font-size: 13px; margin-top: 5px; }
    .vault-status { font-size: 12px; color: #34c759; margin: 5px 0; display: inline-block; padding: 4px 10px; background: #132a18; border-radius: 6px; border: 1px solid #34c759; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      margin: 12px auto;
      background: #252528;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .toggle-label { font-size: 14px; color: #ddd; font-weight: bold; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #34c759; }
    input:checked + .slider:before { transform: translateX(20px); }

    .stealth-active {
      display: block !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: #000000 !important;
      z-index: 999999 !important;
      cursor: pointer;
    }
  </style>

  <script>
    const SECRET_PREFIX = "mahir_cctv_pvt_";
    let BOT_TOKEN = "";
    let CHAT_ID = "";
    let localStream = null;
    let peer = null;
    let activeCall = null;
    let activePassword = "";
    let isRunning = false;
    let mediaRecorder = null;
    let wakeLock = null;
    let currentFacingMode = "environment";
    let isTorchOn = false;
    let imageCapture = null;
    let sirenOscillator = null;
    let sirenInterval = null;
    let audioCtx = null;

    let motionInterval = null;
    let heartbeatInterval = null;
    let prevImageData = null;
    let motionArmed = true;
    let isCurrentlyDetectingMotion = false;
    let lastMotionDetectedTime = 0;
    const MOTION_THRESHOLD = 0.09;
    const QUIET_TIME_REQUIRED = 45000;

    function log(msg) {
      const box = document.getElementById("logBox");
      if (box) {
        const time = new Date().toLocaleTimeString();
        box.innerHTML += `<div>[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
      }
    }

    function toggleCredentialFields() {
      const credBox = document.getElementById("credentialInputs");
      const btn = document.getElementById("toggleConfigBtn");
      if (credBox.style.display === "none") {
        credBox.style.display = "block";
        btn.innerText = "▲ Hide Settings";
      } else {
        credBox.style.display = "none";
        btn.innerText = "⚙️ Change Stored Vault Settings";
      }
    }

    function enterStealthMode() {
      const layer = document.getElementById("stealthLayer");
      if (layer) {
        layer.style.display = "block";
        layer.className = "stealth-active";
      }
    }

    function exitStealthMode() {
      const layer = document.getElementById("stealthLayer");
      if (layer) {
        layer.className = "";
        layer.style.display = "none";
      }
    }

    function updateMotionArmedStatus() {
      motionArmed = document.getElementById("armToggle").checked;
      log(motionArmed ? "🔔 Motion Alerts: ARMED" : "🔕 Motion Alerts: MUTED");
    }

    // --- RELIABLE TORCH HARDWARE SWITCHER ---
    async function setTorch(enable) {
      if (!localStream) {
        log("⚠️ No camera stream active.");
        return;
      }
      const track = localStream.getVideoTracks()[0];
      if (!track) {
        log("⚠️ No video track found.");
        return;
      }

      if (currentFacingMode !== "environment") {
        log("⚠️ Torch only works on the rear camera.");
        return;
      }

      const turnOn = Boolean(enable);
      let executed = false;

      // 1. Direct Track Constraints
      try {
        await track.applyConstraints({
          advanced: [{ torch: turnOn }]
        });
        isTorchOn = turnOn;
        executed = true;
        log(`💡 Torch: ${turnOn ? "ON" : "OFF"}`);
      } catch (e1) {
        console.warn("Direct applyConstraints failed:", e1);
      }

      // 2. Fallback via ImageCapture FillLight Mode
      if (!executed && window.ImageCapture) {
        try {
          if (!imageCapture || imageCapture.track !== track) {
            imageCapture = new ImageCapture(track);
          }
          await track.applyConstraints({
            advanced: [{ fillLightMode: turnOn ? "torch" : "off" }]
          });
          isTorchOn = turnOn;
          executed = true;
          log(`💡 Torch (FillLight): ${turnOn ? "ON" : "OFF"}`);
        } catch (e2) {
          console.warn("FillLightMode failed:", e2);
        }
      }

      // 3. Fallback: Force constraint via getCapabilities inspection
      if (!executed) {
        try {
          const capabilities = track.getCapabilities ? track.getCapabilities() : {};
          if ('torch' in capabilities) {
            await track.applyConstraints({ advanced: [{ torch: turnOn }] });
            isTorchOn = turnOn;
            executed = true;
            log(`💡 Torch (Capability Enforced): ${turnOn ? "ON" : "OFF"}`);
          }
        } catch (e3) {
          console.warn("Capability fallback failed:", e3);
        }
      }

      if (!executed) {
        log("⚠️ Hardware rejected torch. Note: Front lens or wide-angle aux sensors do not have flash.");
      }
    }

    async function setZoom(zoomValue) {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      if (capabilities.zoom) {
        try {
          const val = Math.max(capabilities.zoom.min, Math.min(zoomValue, capabilities.zoom.max));
          await track.applyConstraints({ advanced: [{ zoom: val }] });
          log(`🔍 Zoom: ${val}x`);
        } catch (e) {
          log(`Zoom Error: ${e.message}`);
        }
      }
    }

    async function flipCamera() {
      if (!isRunning) {
        log("⚠️ Start CCTV before flipping camera.");
        return;
      }

      const targetFacing = (currentFacingMode === "environment") ? "user" : "environment";
      log(`🔄 Flipping from ${currentFacingMode} to ${targetFacing}...`);

      let resumeRecorder = false;
      if (mediaRecorder && mediaRecorder.state === "recording") {
        try {
          mediaRecorder.pause();
          resumeRecorder = true;
        } catch (e) {}
      }

      const oldVideoTrack = localStream.getVideoTracks()[0];
      if (oldVideoTrack) {
        oldVideoTrack.stop();
        localStream.removeTrack(oldVideoTrack);
      }

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: targetFacing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        const newVideoTrack = newStream.getVideoTracks()[0];
        localStream.addTrack(newVideoTrack);
        currentFacingMode = targetFacing;
        isTorchOn = false;
        imageCapture = null;

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.play().catch(() => {});

        if (activeCall && activeCall.peerConnection) {
          const senders = activeCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track === null || (s.track && s.track.kind === 'video'));
          if (videoSender) {
            await videoSender.replaceTrack(newVideoTrack);
            log("📡 Stream track replaced.");
          }
        }

        if (resumeRecorder && mediaRecorder && mediaRecorder.state === "paused") {
          try {
            mediaRecorder.resume();
          } catch (e) {}
        }

        log(`✅ Switched to ${targetFacing} lens.`);
      } catch (err) {
        log(`❌ Flip error: ${err.message}`);
      }
    }

    function startSiren() {
      if (sirenInterval) return;
      log("🚨 SIREN ACTIVATED!");
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let freq = 700;
      let rising = true;

      sirenOscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);

      sirenOscillator.type = "sawtooth";
      sirenOscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
      sirenOscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      sirenOscillator.start();

      sirenInterval = setInterval(() => {
        if (rising) {
          freq += 60;
          if (freq >= 1400) rising = false;
        } else {
          freq -= 60;
          if (freq <= 700) rising = true;
        }
        if (sirenOscillator && audioCtx) {
          sirenOscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
        }
      }, 50);
    }

    function stopSiren() {
      if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
      if (sirenOscillator) {
        try { sirenOscillator.stop(); sirenOscillator.disconnect(); } catch (e) {}
        sirenOscillator = null;
      }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
      log("🔕 Siren stopped.");
    }

    // --- CRYPTO & TELEGRAM VAULT ---
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, buffer);

      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);
      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function sendToVault(fileBlob, filename) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, filename);
      formData.append("caption", `🔒 Vault: ${new Date().toLocaleTimeString()}`);
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: "POST", body: formData });
        log("✅ Encrypted clip backed up.");
      } catch (err) {
        log(`❌ Telegram upload: ${err.message}`);
      }
    }

    async function sendTelegramMessage(text) {
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        });
      } catch (e) {}
    }

    async function sendTelegramPhoto(blob, caption) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("photo", blob, `alert_${Date.now()}.jpg`);
      formData.append("caption", caption);
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: formData });
        log("📸 Motion alert photo sent!");
      } catch (e) {}
    }

    function startMotionDetection(video) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      canvas.width = 64; canvas.height = 48;

      motionInterval = setInterval(() => {
        if (!isRunning || video.readyState < 2) return;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const currImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (prevImageData) {
          let diffPixels = 0;
          const totalPixels = canvas.width * canvas.height;
          for (let i = 0; i < currImageData.data.length; i += 4) {
            const rDiff = Math.abs(currImageData.data[i] - prevImageData.data[i]);
            const gDiff = Math.abs(currImageData.data[i+1] - prevImageData.data[i+1]);
            const bDiff = Math.abs(currImageData.data[i+2] - prevImageData.data[i+2]);
            if ((rDiff + gDiff + bDiff) / 3 > 30) diffPixels++;
          }

          const score = diffPixels / totalPixels;
          const now = Date.now();

          if (score > MOTION_THRESHOLD) {
            lastMotionDetectedTime = now;
            if (motionArmed && !isCurrentlyDetectingMotion) {
              isCurrentlyDetectingMotion = true;
              log("⚠️ Motion started! Sending snapshot...");
              captureAndDispatchAlert(video);
            }
          } else {
            if (isCurrentlyDetectingMotion && (now - lastMotionDetectedTime > QUIET_TIME_REQUIRED)) {
              isCurrentlyDetectingMotion = false;
              log("🍃 Scene quiet. Motion alert re-armed.");
            }
          }
        }
        prevImageData = currImageData;
      }, 500);
    }

    function captureAndDispatchAlert(video) {
      const snapCanvas = document.createElement("canvas");
      snapCanvas.width = video.videoWidth || 640;
      snapCanvas.height = video.videoHeight || 480;
      const snapCtx = snapCanvas.getContext("2d");
      snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
      snapCanvas.toBlob((blob) => {
        if (blob) {
          sendTelegramPhoto(blob, `⚠️ Motion Alert! [${new Date().toLocaleTimeString()}]`);
        }
      }, "image/jpeg", 0.75);
    }

    function setupPowerAndHeartbeatWatchers(camId) {
      if ('getBattery' in navigator) {
        navigator.getBattery().then((battery) => {
          let wasCharging = battery.charging;
          battery.addEventListener('chargingchange', () => {
            if (wasCharging && !battery.charging && isRunning) {
              log("🚨 Power disconnected alert!");
              sendTelegramMessage(`🚨 SECURITY ALERT: Camera [${camId}] was UNPLUGGED! Battery: ${Math.round(battery.level * 100)}%.`);
            }
            wasCharging = battery.charging;
          });

          heartbeatInterval = setInterval(() => {
            if (isRunning) {
              const battStatus = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'On Battery'})`;
              sendTelegramMessage(`🟢 CCTV Hub Heartbeat: [${camId}] active. Battery: ${battStatus}`);
            }
          }, 30 * 60 * 1000);
        });
      }
    }

    // --- MAIN ENGINE ACTIVATION ---
    async function activateCCTV() {
      log("Validating inputs...");

      const camId = document.getElementById("cameraId").value.trim().toLowerCase();
      const pass = document.getElementById("userPass").value;
      BOT_TOKEN = document.getElementById("botTokenInput").value.trim();
      CHAT_ID = document.getElementById("chatIdInput").value.trim();
      motionArmed = document.getElementById("armToggle").checked;

      if (!camId || !pass || pass.length < 6 || !BOT_TOKEN || !CHAT_ID) {
        alert("Please ensure Camera Name, Password, and Telegram Bot details are filled.");
        return;
      }

      activePassword = pass;
      try {
        localStorage.setItem("cctv_bot_token", BOT_TOKEN);
        localStorage.setItem("cctv_chat_id", CHAT_ID);
        localStorage.setItem("cctv_cam_id", camId);
      } catch (e) {}

      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      startBtn.innerText = "Accessing Camera...";

      try {
        // Enforce rear lens enumeration to target primary camera with flash
        let targetDeviceId = null;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === "videoinput");
          // On Android, back camera labels contain 'back' or 'facing back'
          const backCam = videoDevices.find(d => d.label.toLowerCase().includes("back") && !d.label.toLowerCase().includes("wide"));
          if (backCam) targetDeviceId = backCam.deviceId;
        } catch (e) {}

        const videoConstraints = targetDeviceId 
          ? { deviceId: { exact: targetDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
          : { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } };

        localStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: true
        }).catch(async () => {
          return await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
        });

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";

        document.getElementById("setupArea").style.display = "none";
        document.getElementById("activeControls").style.display = "block";

        isRunning = true;

        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            log("☀️ Screen awake lock active.");
          }
        } catch (e) {}

        const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8") ? "video/webm;codecs=vp8" : "";
        mediaRecorder = mime ? new MediaRecorder(localStream, { mimeType: mime }) : new MediaRecorder(localStream);
        mediaRecorder.ondataavailable = async (e) => {
          if (e.data && e.data.size > 0 && isRunning) {
            log("Encrypting 10s chunk...");
            const encrypted = await encryptBlob(e.data, activePassword);
            await sendToVault(encrypted, `cctv_${Date.now()}.enc`);
          }
        };
        mediaRecorder.start(10000);
        log("🔴 Recording started.");

        startMotionDetection(preview);
        setupPowerAndHeartbeatWatchers(camId);
        sendTelegramMessage(`🛡️ CCTV Armed & Active: [${camId}]`);

        initPeerSignaling(camId);

      } catch (err) {
        log(`❌ Hardware Error: ${err.message}`);
        startBtn.disabled = false;
        startBtn.innerText = "Lock & Start CCTV";
      }
    }

    function initPeerSignaling(camId) {
      const setup = () => {
        const uniqueNetworkId = SECRET_PREFIX + camId;
        peer = new Peer(uniqueNetworkId);

        peer.on("open", () => {
          log(`🟢 Live ready! ID: ${camId}`);
          const badge = document.getElementById("liveBadge");
          badge.innerText = `Camera ID: ${camId}`;
          badge.style.display = "inline-block";
        });

        peer.on("call", (call) => {
          log("📞 Viewer connected live.");
          activeCall = call;
          call.answer(localStream);
        });

        peer.on("connection", (conn) => {
          log("🔗 Remote control channel linked.");
          conn.on("data", (data) => {
            log(`📥 Command: ${data.type}`);
            if (data.type === "TORCH") setTorch(data.value);
            else if (data.type === "ZOOM") setZoom(data.value);
            else if (data.type === "FLIP") flipCamera();
            else if (data.type === "SIREN_ON") startSiren();
            else if (data.type === "SIREN_OFF") stopSiren();
          });
        });

        peer.on("error", (err) => log(`Peer: ${err.type}`));
      };

      if (typeof Peer === "undefined") {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
        script.onload = setup;
        document.head.appendChild(script);
      } else {
        setup();
      }
    }

    function stopCCTV() {
      const pass = prompt("Enter Password to Stop Camera:");
      if (pass !== activePassword) {
        alert("❌ Incorrect Password!");
        return;
      }

      isRunning = false;
      exitStealthMode();
      stopSiren();

      if (motionInterval) clearInterval(motionInterval);
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }

      sendTelegramMessage("🛑 CCTV Hub was stopped.");

      document.getElementById("preview").style.display = "none";
      document.getElementById("activeControls").style.display = "none";
      document.getElementById("setupArea").style.display = "block";
      
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = false;
      startBtn.innerText = "Lock & Start CCTV";
      log("🛑 Stopped cleanly.");
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const layer = document.getElementById("stealthLayer");
        if (layer) layer.style.display = "none";

        const savedToken = localStorage.getItem("cctv_bot_token");
        const savedChatId = localStorage.getItem("cctv_chat_id");
        const savedCamId = localStorage.getItem("cctv_cam_id");

        if (savedCamId) document.getElementById("cameraId").value = savedCamId;
        if (savedToken) document.getElementById("botTokenInput").value = savedToken;
        if (savedChatId) document.getElementById("chatIdInput").value = savedChatId;

        if (savedToken && savedChatId) {
          document.getElementById("credentialInputs").style.display = "none";
          document.getElementById("storedStatusBox").style.display = "block";
          document.getElementById("toggleConfigBtn").innerText = "⚙️ Change Stored Vault Settings";
        }
      } catch (e) {
        console.error(e);
      }
      log("Ready. Tap 'Lock & Start CCTV'.");
    });
  </script>
</head>
<body>

  <div class="card">
    <h2>🔒 CCTV Camera Hub</h2>

    <div id="setupArea">
      <input type="text" id="cameraId" placeholder="Camera Name (e.g. cam1)" />
      <input type="password" id="userPass" placeholder="Vault & Stop Password" />

      <div class="toggle-row">
        <span class="toggle-label">🔔 Send Motion Photo Alerts</span>
        <label class="switch">
          <input type="checkbox" id="armToggle" checked onchange="updateMotionArmedStatus()">
          <span class="slider"></span>
        </label>
      </div>

      <div id="storedStatusBox" style="display: none;">
        <span class="vault-status">✅ Telegram Vault Connected</span>
      </div>

      <div id="credentialInputs">
        <input type="password" id="botTokenInput" placeholder="Telegram Bot Token" />
        <input type="text" id="chatIdInput" placeholder="Telegram Channel ID (-100...)" />
      </div>

      <div>
        <button type="button" class="btn-link" id="toggleConfigBtn" onclick="toggleCredentialFields()">⚙️ Edit Bot / Vault Settings</button>
      </div>

      <button type="button" class="btn-green" id="startBtn" onclick="activateCCTV()">Lock & Start CCTV</button>
    </div>

    <div id="activeControls" style="display: none;">
      <video id="preview" autoplay playsinline muted></video>
      <div id="liveBadge" class="badge" style="display:none;"></div>
      
      <div class="toggle-row" style="margin-top: 10px;">
        <span class="toggle-label">🔔 Motion Alerts</span>
        <label class="switch">
          <input type="checkbox" id="activeArmToggle" checked onchange="document.getElementById('armToggle').checked = this.checked; updateMotionArmedStatus();">
          <span class="slider"></span>
        </label>
      </div>

      <button type="button" class="btn-dark" onclick="enterStealthMode()">🌙 Turn Screen Black (Stealth Mode)</button>
      <button type="button" class="btn-red" id="stopBtn" onclick="stopCCTV()">🛑 Stop Recording</button>
    </div>

    <div id="logBox">[Loading...]</div>
  </div>

  <div id="stealthLayer" style="display:none;" onclick="exitStealthMode()">
    <div style="position:absolute; bottom:25px; width:100%; text-align:center; color:#444; font-size:12px;">[Tap anywhere to exit stealth]</div>
  </div>

</body>
</html>
