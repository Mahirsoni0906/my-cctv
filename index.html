<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV - Encrypted Camera</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input { width: 90%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 16px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; background: #34c759; color: white; border: none; border-radius: 8px; cursor: pointer; }
    video { width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #333; display: none; }
    #status { font-size: 14px; color: #ffd60a; margin-top: 15px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 Encrypted CCTV</h2>
    <p style="font-size: 13px; color: #8e8e93;">Video is encrypted in memory before leaving this device.</p>

    <input type="password" id="userPass" placeholder="Create a Secret Password" />
    <br>
    <button id="startBtn" onclick="activateCCTV()">Start Camera & Storage</button>

    <video id="preview" autoplay playsinline muted></video>
    <p id="status">Enter your password and tap Start.</p>
  </div>

  <script>
    // --- YOUR CREDENTIALS ---
    const BOT_TOKEN = "8870229096:AAFJSMIBUsWuWTH1v7MyEUdIf8t5ToNHhaQ";
    const CHAT_ID = "-1003997436380";

    let localStream = null;
    let mediaRecorder = null;
    let activePassword = "";

    // 1. Derive AES-GCM Key using PBKDF2
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    // 2. Encrypt raw video bytes
    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        buffer
      );

      // Package: [16 bytes Salt] + [12 bytes IV] + [Encrypted Data]
      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);

      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function activateCCTV() {
      const pass = document.getElementById("userPass").value;
      if (!pass || pass.length < 6) {
        alert("Please set a password with at least 6 characters!");
        return;
      }
      activePassword = pass;

      document.getElementById("userPass").style.display = "none";
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("status").innerText = "Requesting camera access...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: true
        });

        const previewElem = document.getElementById("preview");
        previewElem.srcObject = localStream;
        previewElem.style.display = "block";

        document.getElementById("status").innerText = "🔴 Camera Active. Recording 15s encrypted chunks...";
        document.getElementById("status").style.color = "#34c759";

        startLoop();
      } catch (err) {
        document.getElementById("status").innerText = "Camera Error: " + err.message;
        document.getElementById("status").style.color = "#ff453a";
      }
    }

    function startLoop() {
      try {
        mediaRecorder = new MediaRecorder(localStream, { mimeType: "video/webm" });
      } catch (e) {
        mediaRecorder = new MediaRecorder(localStream);
      }

      mediaRecorder.ondataavailable = async (e) => {
        if (e.data && e.data.size > 0) {
          document.getElementById("status").innerText = "🔐 Encrypting in memory...";
          
          const encryptedFile = await encryptBlob(e.data, activePassword);
          
          document.getElementById("status").innerText = "☁️ Uploading encrypted package to vault...";
          await sendToVault(encryptedFile);
          
          document.getElementById("status").innerText = "🔴 Active. Recording next chunk...";
          document.getElementById("status").style.color = "#34c759";
        }
      };

      mediaRecorder.start();
      setInterval(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          mediaRecorder.start();
        }
      }, 15000); // New clip every 15 seconds
    }

    async function sendToVault(fileBlob) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, `cctv_${Date.now()}.enc`);
      formData.append("caption", `🔒 Encrypted Chunk: ${new Date().toLocaleTimeString()}`);

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
          method: "POST",
          body: formData
        });
      } catch (err) {
        console.error("Vault transfer error:", err);
      }
    }
  </script>
</body>
</html>
