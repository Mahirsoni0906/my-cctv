<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CCTV - Camera Node</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { background: #000; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 420px; margin: auto; border: 1px solid #333; }
    input { width: 92%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 15px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-green { background: #34c759; color: white; }
    .btn-red { background: #ff453a; color: white; }
    .btn-link { background: transparent; color: #0a84ff; font-size: 13px; text-decoration: underline; margin-top: 8px; padding: 6px; cursor: pointer; border: none; }
    video { width: 100%; border-radius: 8px; margin-top: 10px; border: 2px solid #333; display: none; background: #000; }
    #logBox { margin-top: 15px; padding: 10px; background: #000; border-radius: 8px; font-family: monospace; font-size: 11px; text-align: left; height: 130px; overflow-y: auto; color: #34c759; border: 1px solid #222; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2c2c2e; color: #ffd60a; font-family: monospace; font-size: 13px; margin-top: 5px; }
    .vault-status { font-size: 12px; color: #34c759; margin: 5px 0; display: inline-block; padding: 4px 10px; background: #132a18; border-radius: 6px; border: 1px solid #34c759; }
  </style>

  <script>
    const SECRET_PREFIX = "mahir_cctv_pvt_";
    let BOT_TOKEN = "";
    let CHAT_ID = "";
    let localStream = null;
    let peer = null;
    let activePassword = "";
    let isRunning = false;
    let mediaRecorder = null;
    let wakeLock = null;

    function log(msg) {
      const box = document.getElementById("logBox");
      if (box) {
        const time = new Date().toLocaleTimeString();
        box.innerHTML += `<div>[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
      }
    }

    window.onerror = function(msg, url, lineNo) {
      log(`⚠️ Script Error (L${lineNo}): ${msg}`);
      return false;
    };

    function toggleCredentialFields() {
      const credBox = document.getElementById("credentialInputs");
      const btn = document.getElementById("toggleConfigBtn");
      if (credBox.style.display === "none") {
        credBox.style.display = "block";
        btn.innerText = "▲ Hide Settings";
      } else {
        credBox.style.display = "none";
        btn.innerText = "⚙️ Change Stored Vault Settings";
      }
    }

    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, buffer);

      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);
      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function sendToVault(fileBlob, filename) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, filename);
      formData.append("caption", `🔒 Vault: ${new Date().toLocaleTimeString()}`);
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: "POST", body: formData });
        log("✅ Encrypted clip backed up.");
      } catch (err) {
        log(`❌ Telegram upload: ${err.message}`);
      }
    }

    async function activateCCTV() {
      log("Button clicked. Validating inputs...");

      const camIdElem = document.getElementById("cameraId");
      const passElem = document.getElementById("userPass");
      const tokenElem = document.getElementById("botTokenInput");
      const chatElem = document.getElementById("chatIdInput");
      const startBtn = document.getElementById("startBtn");

      const camId = camIdElem.value.trim().toLowerCase();
      const pass = passElem.value;
      BOT_TOKEN = tokenElem.value.trim();
      CHAT_ID = chatElem.value.trim();

      if (!camId) {
        alert("Please enter a Camera Name.");
        return;
      }
      if (!pass || pass.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }
      if (!BOT_TOKEN || !CHAT_ID) {
        alert("Please enter Telegram Bot Token and Channel ID.");
        return;
      }

      activePassword = pass;

      try {
        localStorage.setItem("cctv_bot_token", BOT_TOKEN);
        localStorage.setItem("cctv_chat_id", CHAT_ID);
        localStorage.setItem("cctv_cam_id", camId);
      } catch (e) {}

      startBtn.disabled = true;
      startBtn.innerText = "Accessing Camera...";
      log("Requesting camera access...");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: true
        }).catch(async () => {
          log("Audio unavailable. Continuing with video-only...");
          return await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
        });

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";

        document.getElementById("setupArea").style.display = "none";
        document.getElementById("activeControls").style.display = "block";

        isRunning = true;

        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            log("☀️ Screen awake lock active.");
          }
        } catch (e) {}

        const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8") ? "video/webm;codecs=vp8" : "";
        mediaRecorder = mime ? new MediaRecorder(localStream, { mimeType: mime }) : new MediaRecorder(localStream);
        mediaRecorder.ondataavailable = async (e) => {
          if (e.data && e.data.size > 0 && isRunning) {
            log("Encrypting 10s chunk...");
            const encrypted = await encryptBlob(e.data, activePassword);
            await sendToVault(encrypted, `cctv_${Date.now()}.enc`);
          }
        };
        mediaRecorder.start(10000);
        log("🔴 Recording started.");

        initPeerLive(camId);

      } catch (err) {
        log(`❌ Hardware Error: ${err.name} - ${err.message}`);
        startBtn.disabled = false;
        startBtn.innerText = "Lock & Start CCTV";
      }
    }

    function initPeerLive(camId) {
      if (typeof Peer === "undefined") {
        log("Loading live stream module...");
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
        script.onload = () => setupPeer(camId);
        script.onerror = () => log("⚠️ Live streaming script blocked. Vault recording continues.");
        document.head.appendChild(script);
      } else {
        setupPeer(camId);
      }
    }

    function setupPeer(camId) {
      try {
        const uniqueNetworkId = SECRET_PREFIX + camId;
        peer = new Peer(uniqueNetworkId);
        peer.on("open", () => {
          log(`🟢 Live stream ready! ID: ${camId}`);
          const badge = document.getElementById("liveBadge");
          badge.innerText = `Camera ID: ${camId}`;
          badge.style.display = "inline-block";
        });
        peer.on("call", (call) => {
          log("📞 Viewer connected.");
          call.answer(localStream);
        });
        peer.on("error", (err) => log(`Peer: ${err.type}`));
      } catch (e) {
        log(`Live error: ${e.message}`);
      }
    }

    function stopCCTV() {
      const pass = prompt("Enter Password to Stop Camera:");
      if (pass !== activePassword) {
        alert("❌ Incorrect Password!");
        return;
      }

      isRunning = false;
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peer) peer.destroy();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }

      document.getElementById("preview").style.display = "none";
      document.getElementById("activeControls").style.display = "none";
      document.getElementById("setupArea").style.display = "block";
      
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = false;
      startBtn.innerText = "Lock & Start CCTV";
      log("🛑 Stopped cleanly.");
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const savedToken = localStorage.getItem("cctv_bot_token");
        const savedChatId = localStorage.getItem("cctv_chat_id");
        const savedCamId = localStorage.getItem("cctv_cam_id");

        if (savedCamId) document.getElementById("cameraId").value = savedCamId;
        if (savedToken && savedChatId) {
          document.getElementById("botTokenInput").value = savedToken;
          document.getElementById("chatIdInput").value = savedChatId;
          document.getElementById("credentialInputs").style.display = "none";
          document.getElementById("storedStatusBox").style.display = "block";
          document.getElementById("toggleConfigBtn").innerText = "⚙️ Change Stored Vault Settings";
        }
        log("Ready. Tap 'Lock & Start CCTV'.");
      } catch (e) {
        log("Ready.");
      }
    });

    window.addEventListener("popstate", () => {
      if (isRunning) {
        window.history.pushState(null, null, window.location.href);
        alert("⚠️ Camera is active! Stop recording with password before exiting.");
      }
    });
  </script>
</head>
<body>

  <div class="card">
    <h2>🔒 CCTV Camera Hub</h2>

    <div id="setupArea">
      <input type="text" id="cameraId" placeholder="Camera Name (e.g. cam1)" />
      <input type="password" id="userPass" placeholder="Vault & Stop Password" />

      <div id="storedStatusBox" style="display: none;">
        <span class="vault-status">✅ Telegram Vault Connected</span>
      </div>

      <div id="credentialInputs">
        <input type="password" id="botTokenInput" placeholder="Telegram Bot Token" />
        <input type="text" id="chatIdInput" placeholder="Telegram Channel ID (-100...)" />
      </div>

      <div>
        <button type="button" class="btn-link" id="toggleConfigBtn" onclick="toggleCredentialFields()">⚙️ Edit Bot / Vault Settings</button>
      </div>

      <button type="button" class="btn-green" id="startBtn" onclick="activateCCTV()">Lock & Start CCTV</button>
    </div>

    <div id="activeControls" style="display: none;">
      <video id="preview" autoplay playsinline muted></video>
      <div id="liveBadge" class="badge" style="display:none;"></div>
      <button type="button" class="btn-red" id="stopBtn" onclick="stopCCTV()">🛑 Stop Recording</button>
    </div>

    <div id="logBox">[Loading...]</div>
  </div>

</body>
</html>
