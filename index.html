<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CCTV - Camera Node</title>
  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    }
    // Trap back navigation and display the warning modal
function trapBackButton() {
  // Push state to create a history buffer
  window.history.pushState({ page: "recording" }, null, window.location.href);

  window.addEventListener("popstate", function (event) {
    if (isRunning) {
      // Re-push state immediately so the page doesn't pop back
      window.history.pushState({ page: "recording" }, null, window.location.href);

      // Show the customized warning popup
      document.getElementById("backWarningModal").style.display = "block";
    }
  });
}

function closeBackWarning() {
  document.getElementById("backWarningModal").style.display = "none";
}
  </script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #000; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; overflow-x: hidden; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 420px; margin: auto; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 16px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-green { background: #34c759; color: white; }
    .btn-red { background: #ff453a; color: white; }
    video { width: 100%; border-radius: 8px; margin-top: 10px; border: 2px solid #333; display: none; }
    #logBox { margin-top: 15px; padding: 10px; background: #000; border-radius: 8px; font-family: monospace; font-size: 11px; text-align: left; height: 110px; overflow-y: auto; color: #34c759; border: 1px solid #222; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2c2c2e; color: #ffd60a; font-family: monospace; font-size: 13px; margin-top: 5px; }

    /* Modal for password-protected shutdown */
    #stopModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      padding-top: 25vh;
    }
    .modal-content {
      background: #1c1c1e;
      padding: 25px;
      border-radius: 12px;
      max-width: 340px;
      margin: auto;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <div class="card" id="mainContainer">
    <h2>🔒 CCTV Camera Hub</h2>

    <!-- Setup view -->
    <div id="setupArea">
      <input type="text" id="cameraId" placeholder="Choose Camera ID (e.g. cam1)" />
      <input type="password" id="userPass" placeholder="Vault & Stop Password" />
      <button class="btn-green" onclick="activateCCTV()">Lock & Start CCTV</button>
    </div>

    <!-- Active surveillance view -->
    <video id="preview" autoplay playsinline muted></video>
    <div id="liveBadge" class="badge" style="display:none;"></div>
    
    <div id="activeControls" style="display:none;">
      <button class="btn-red" onclick="promptStop()">🛑 Stop Recording</button>
    </div>

    <div id="logBox">[Enter ID and password to lock screen & activate]</div>
  </div>

  <!-- Password Prompt Modal -->
  <div id="stopModal">
    <div class="modal-content">
      <h3>Authorize Stop</h3>
      <p style="font-size: 13px; color: #aaa;">Enter your password to deactivate the camera.</p>
      <input type="password" id="stopPassInput" placeholder="Enter Password" />
      <button class="btn-red" onclick="verifyAndStop()">Confirm & Stop</button>
      <button style="background:#555; color:#fff;" onclick="closeModal()">Cancel</button>
      <p id="stopError" style="color: #ff453a; font-size: 13px; margin-top: 8px;"></p>
    </div>
  </div>
  <!-- Back Button Warning Popup -->
  <div id="backWarningModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; padding-top:30vh;">
    <div style="background:#1c1c1e; padding:25px; border-radius:12px; max-width:320px; margin:auto; border:1px solid #ff453a; box-shadow:0 0 20px rgba(255,69,58,0.4);">
      <h3 style="color:#ff453a; margin-top:0;">⚠️ Camera Active</h3>
      <p style="font-size:14px; color:#ddd; line-height:1.4;">
        You cannot leave or exit while recording. Please stop the recording with your password first.
      </p>
      <button style="background:#007aff; color:#fff; width:100%; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="closeBackWarning()">OK, Understood</button>
    </div>
  </div>

  <script>
    // --- CREDENTIALS ---
    const BOT_TOKEN = "8870229096:AAFJSMIBUsWuWTH1v7MyEUdIf8t5ToNHhaQ";
    const CHAT_ID = "-1003997436380";

    let localStream = null;
    let peer = null;
    let activePassword = "";
    let isRunning = false;
    let mediaRecorder = null;
    let wakeLock = null;

    function log(msg) {
      const box = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      box.innerHTML += `<div>[${time}] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    // 1. Prevent screen from dimming/sleeping
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          log("☀️ Screen WakeLock active (no sleep).");
        }
      } catch (err) {
        console.warn("WakeLock not available:", err.message);
      }
    }

    // 2. Encryption derivation
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, buffer);

      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);
      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function sendToVault(fileBlob, filename) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, filename);
      formData.append("caption", `🔒 Vault: ${new Date().toLocaleTimeString()}`);
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: "POST", body: formData });
        log("✅ Encrypted clip sent to Telegram.");
      } catch (err) {
        log(`❌ Backup failed: ${err.message}`);
      }
    }

    // 3. Activation & Kiosk Lock
    async function activateCCTV() {
      const camId = document.getElementById("cameraId").value.trim().toLowerCase();
      const pass = document.getElementById("userPass").value;
      isRunning = true;
    trapBackButton(); // <-- ADD THIS LINE
    await requestWakeLock();
    initLiveStreaming(camId);
    startEncryptedStorageLoop();

      if (!camId || !pass || pass.length < 6) {
        alert("Enter Camera ID and password (min 6 chars).");
        return;
      }
      activePassword = pass;

      // Lock browser into Fullscreen Mode
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
        console.warn("Fullscreen request skipped.");
      }

      // Hide config inputs
      document.getElementById("setupArea").style.display = "none";
      document.getElementById("activeControls").style.display = "block";

      log("Requesting camera access...");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: true
        });

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";

        isRunning = true;
        await requestWakeLock();
        initLiveStreaming(camId);
        startEncryptedStorageLoop();

        log("🔒 Camera locked and running.");
      } catch (err) {
        log(`Hardware Error: ${err.message}`);
      }
      
    }

    function initLiveStreaming(camId) {
      log(`Registering ID: ${camId}...`);
      peer = new Peer(camId);

      peer.on("open", (id) => {
        log(`🟢 Live broadcast ready! ID: ${id}`);
        const badge = document.getElementById("liveBadge");
        badge.innerText = `Camera ID: ${id}`;
        badge.style.display = "inline-block";
      });

      peer.on("call", (call) => {
        log("📞 Viewer connecting live...");
        call.answer(localStream);
        call.on("stream", () => {});
      });

      peer.on("error", (err) => {
        log(`Peer Error: ${err.type}`);
      });
    }

    function startEncryptedStorageLoop() {
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8") ? "video/webm;codecs=vp8" : "";
      mediaRecorder = mime ? new MediaRecorder(localStream, { mimeType: mime }) : new MediaRecorder(localStream);

      mediaRecorder.ondataavailable = async (e) => {
        if (e.data && e.data.size > 0 && isRunning) {
          log("Encrypting 10s chunk...");
          const encrypted = await encryptBlob(e.data, activePassword);
          await sendToVault(encrypted, `cctv_${Date.now()}.enc`);
        }
      };

      mediaRecorder.start(10000);
    }

    // 4. Password-Protected Stopping Sequence
    function promptStop() {
      document.getElementById("stopError").innerText = "";
      document.getElementById("stopPassInput").value = "";
      document.getElementById("stopModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("stopModal").style.display = "none";
    }

    function verifyAndStop() {
      const inputPass = document.getElementById("stopPassInput").value;
      if (inputPass !== activePassword) {
        document.getElementById("stopError").innerText = "❌ Incorrect Password!";
        return;
      }

      // Password matches: Stop everything cleanly
      isRunning = false;
      closeModal();

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      if (peer) {
        peer.destroy();
      }

      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }

      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }

      document.getElementById("preview").style.display = "none";
      document.getElementById("activeControls").style.display = "none";
      document.getElementById("liveBadge").style.display = "none";
      document.getElementById("setupArea").style.display = "block";

      log("🛑 CCTV stopped successfully by authorized user.");
    }

    // 5. Anti-tamper: Intercept tab close, back swipe, or reload attempts
    window.addEventListener("beforeunload", (e) => {
      if (isRunning) {
        e.preventDefault();
        e.returnValue = "Camera is actively recording! Password required to stop.";
        return e.returnValue;
      }
    });
  </script>
</body>
</html>
