<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV - Encrypted Camera</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
    .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; font-size: 16px; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; background: #34c759; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
    .secondary-btn { background: #007aff; }
    video { width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #333; display: none; }
    #logBox { margin-top: 15px; padding: 10px; background: #000; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; height: 140px; overflow-y: auto; color: #34c759; border: 1px solid #333; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 Encrypted CCTV</h2>
    
    <input type="password" id="userPass" placeholder="Enter Secret Password" />
    <button id="startBtn" onclick="activateCCTV()">Start Camera & Vault</button>
    <button class="secondary-btn" id="testBtn" onclick="sendTestEncryptedFile()">Send 1-Sec Test File</button>

    <video id="preview" autoplay playsinline muted></video>
    <div id="logBox">[System ready. Enter password and tap test or start]</div>
  </div>

  <script>
    // --- YOUR CREDENTIALS ---
    const BOT_TOKEN = "8870229096:AAFJSMIBUsWuWTH1v7MyEUdIf8t5ToNHhaQ";
    const CHAT_ID = "-1003997436380";

    let localStream = null;
    let mediaRecorder = null;
    let activePassword = "";

    function log(msg) {
      const box = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      box.innerHTML += `<div>[${time}] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
    }

    async function encryptBlob(blob, password) {
      const buffer = await blob.arrayBuffer();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const key = await getCryptoKey(password, salt);
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        buffer
      );

      const packed = new Uint8Array(salt.byteLength + iv.byteLength + ciphertext.byteLength);
      packed.set(salt, 0);
      packed.set(iv, salt.byteLength);
      packed.set(new Uint8Array(ciphertext), salt.byteLength + iv.byteLength);

      return new Blob([packed], { type: "application/octet-stream" });
    }

    async function sendToVault(fileBlob, filename) {
      log(`Uploading ${filename}...`);
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", fileBlob, filename);
      formData.append("caption", `🔒 Vault File: ${new Date().toLocaleTimeString()}`);

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
          method: "POST",
          body: formData
        });
        const json = await res.json();
        if (json.ok) {
          log(`✅ Upload SUCCESS! Check Telegram.`);
        } else {
          log(`❌ Telegram Error: ${json.description}`);
        }
      } catch (err) {
        log(`❌ Network Error: ${err.message}`);
      }
    }

    // Direct test to verify encryption + upload in 1 second
    async function sendTestEncryptedFile() {
      const pass = document.getElementById("userPass").value || "test123";
      log("Generating test dummy file...");
      const dummyBlob = new Blob(["test-video-content-12345"], { type: "text/plain" });
      const encrypted = await encryptBlob(dummyBlob, pass);
      await sendToVault(encrypted, `test_${Date.now()}.enc`);
    }

    async function activateCCTV() {
      const pass = document.getElementById("userPass").value;
      if (!pass || pass.length < 6) {
        alert("Enter a password of at least 6 characters.");
        return;
      }
      activePassword = pass;

      document.getElementById("userPass").style.display = "none";
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("testBtn").style.display = "none";

      log("Requesting camera access...");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: true
        });

        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";
        log("Camera active. Initializing recorder...");

        startRecording();
      } catch (err) {
        log(`Camera error: ${err.message}`);
      }
    }

    function startRecording() {
      // Pick best supported codec
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8")
        ? "video/webm;codecs=vp8"
        : (MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "");

      try {
        mediaRecorder = mime ? new MediaRecorder(localStream, { mimeType: mime }) : new MediaRecorder(localStream);
      } catch (e) {
        mediaRecorder = new MediaRecorder(localStream);
      }

      mediaRecorder.ondataavailable = async (e) => {
        if (e.data && e.data.size > 0) {
          log(`Captured chunk (${Math.round(e.data.size / 1024)} KB). Encrypting...`);
          const encrypted = await encryptBlob(e.data, activePassword);
          await sendToVault(encrypted, `cctv_${Date.now()}.enc`);
        }
      };

      // Record chunks every 10 seconds
      mediaRecorder.start(10000);
      log("Recorder started (10s intervals)...");
    }
  </script>
</body>
</html>
