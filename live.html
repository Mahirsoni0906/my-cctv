<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV - Live Viewer</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { background: #0b0c10; color: #eee; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
    .card { background: #1f2833; padding: 20px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; font-size: 16px; outline: none; }
    button { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; background: #66fcf1; color: #0b0c10; border: none; border-radius: 8px; cursor: pointer; }
    .video-wrapper { position: relative; margin-top: 15px; border-radius: 10px; overflow: hidden; background: #000; border: 2px solid #45a29e; display: none; }
    video { width: 100%; height: auto; max-height: 480px; display: block; object-fit: contain; }
    #status { font-size: 14px; color: #ffd60a; margin-top: 15px; font-weight: bold; }
    .unmute-btn { width: auto; padding: 8px 16px; font-size: 13px; background: #ff5252; color: #fff; margin: 8px 0; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📡 Live CCTV Monitor</h2>
    <input type="text" id="targetCamId" placeholder="Enter Camera Name (e.g. cam1)" />
    <button id="connectBtn" onclick="connectLive()">Connect Live Stream</button>

    <p id="status">Enter the Camera Name and click Connect</p>

    <div class="video-wrapper" id="videoBox">
      <video id="remoteFeed" autoplay playsinline muted></video>
      <div>
        <button class="unmute-btn" id="unmuteBtn" onclick="toggleAudio()">🔊 Unmute Audio</button>
      </div>
    </div>
  </div>

  <script>
    const SECRET_PREFIX = "mahir_cctv_pvt_";
    let peer = null;

    function toggleAudio() {
      const video = document.getElementById("remoteFeed");
      const btn = document.getElementById("unmuteBtn");
      video.muted = !video.muted;
      btn.innerText = video.muted ? "🔊 Unmute Audio" : "🔇 Mute Audio";
      btn.style.background = video.muted ? "#ff5252" : "#34c759";
    }

    function connectLive() {
      const userChosenId = document.getElementById("targetCamId").value.trim().toLowerCase();
      const status = document.getElementById("status");
      const video = document.getElementById("remoteFeed");
      const videoBox = document.getElementById("videoBox");

      if (!userChosenId) {
        alert("Please enter the Camera Name.");
        return;
      }

      const fullNetworkId = SECRET_PREFIX + userChosenId;

      status.innerText = "Connecting to network...";
      status.style.color = "#ffd60a";

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer();

      peer.on("open", () => {
        status.innerText = `Calling camera [${userChosenId}]...`;

        // Dummy stream to trigger the peer call handshake cleanly
        const canvas = document.createElement("canvas");
        canvas.width = 10; canvas.height = 10;
        const dummyStream = canvas.captureStream(5);

        const call = peer.call(fullNetworkId, dummyStream);

        call.on("stream", (remoteStream) => {
          status.innerText = "🔴 LIVE FEED ACTIVE";
          status.style.color = "#34c759";
          videoBox.style.display = "block";

          video.srcObject = remoteStream;
          video.play().catch(() => {});
        });

        call.on("close", () => {
          status.innerText = "Camera disconnected.";
          status.style.color = "#ff453a";
        });
      });

      peer.on("error", (err) => {
        if (err.type === "peer-unavailable") {
          status.innerText = `Camera "${userChosenId}" is offline or not found.`;
        } else {
          status.innerText = `Connection Error: ${err.type}`;
        }
        status.style.color = "#ff453a";
      });
    }
  </script>
</body>
</html>
