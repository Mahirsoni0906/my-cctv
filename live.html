<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CCTV Monitor</title>

  <link rel="manifest" href="manifest-viewer.json">
  <meta name="theme-color" content="#0b0c10">
  <meta name="mobile-web-app-capable" content="yes">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0c10; color: #eee; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; }
    .card { background: #1f2833; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    
    .tabs { display: flex; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #0b0c10; }
    .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #aaa; font-weight: bold; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: #66fcf1; color: #0b0c10; }

    input { width: 95%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; font-size: 16px; outline: none; }
    button.action-btn { width: 95%; padding: 14px; font-size: 16px; font-weight: bold; background: #66fcf1; color: #0b0c10; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
    .video-wrapper { position: relative; margin-top: 15px; border-radius: 10px; overflow: hidden; background: #000; border: 2px solid #45a29e; display: none; }
    video { width: 100%; height: auto; max-height: 440px; display: block; object-fit: contain; }
    #status { font-size: 14px; color: #ffd60a; margin-top: 15px; font-weight: bold; }
    .unmute-btn { width: auto; padding: 10px 20px; font-size: 14px; font-weight: bold; background: #ff5252; color: #fff; margin: 12px 0; border: none; border-radius: 6px; cursor: pointer; }
    
    #decryptTab { display: none; }
    .file-input { border: 1px dashed #45a29e; padding: 15px; border-radius: 8px; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabLiveBtn" onclick="switchTab('live')">📡 Live Feed</button>
      <button class="tab-btn" id="tabVaultBtn" onclick="switchTab('vault')">🔓 Vault Player</button>
    </div>

    <!-- TAB 1: LIVE FEED -->
    <div id="liveTab">
      <input type="text" id="targetCamId" placeholder="Camera Name (e.g. cam1)" />
      <button class="action-btn" id="connectBtn" onclick="connectLive()">Connect Live Stream</button>

      <p id="status">Enter camera name and connect</p>

      <div class="video-wrapper" id="videoBox">
        <video id="remoteFeed" autoplay playsinline></video>
        <div>
          <button class="unmute-btn" id="unmuteBtn" onclick="toggleAudio()">🔊 Unmute Live Audio</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: DECRYPT RECORDED VAULT FILES -->
    <div id="decryptTab">
      <p style="font-size: 13px; color: #aaa;">Select any .enc file from Telegram and unlock it:</p>
      <input type="file" id="filePicker" accept=".enc" class="file-input" />
      <input type="password" id="decryptPass" placeholder="Vault Password" />
      <button class="action-btn" style="background:#45a29e; color:#fff;" onclick="unlockAndPlay()">Decrypt & Play</button>

      <p id="decryptStatus" style="font-size:14px; color:#ffd60a; margin-top:10px;"></p>
      <video id="vaultPlayer" controls playsinline style="width:100%; border-radius:8px; display:none; margin-top:10px; border:2px solid #45a29e;"></video>
    </div>
  </div>

  <script>
    const SECRET_PREFIX = "mahir_cctv_pvt_";
    let peer = null;
    let audioContext = null;

    window.onload = () => {
      const saved = localStorage.getItem("cctv_cam_name");
      if (saved) document.getElementById("targetCamId").value = saved;
    };

    function switchTab(tab) {
      if (tab === 'live') {
        document.getElementById('liveTab').style.display = 'block';
        document.getElementById('decryptTab').style.display = 'none';
        document.getElementById('tabLiveBtn').classList.add('active');
        document.getElementById('tabVaultBtn').classList.remove('active');
      } else {
        document.getElementById('liveTab').style.display = 'none';
        document.getElementById('decryptTab').style.display = 'block';
        document.getElementById('tabVaultBtn').classList.add('active');
        document.getElementById('tabLiveBtn').classList.remove('active');
      }
    }

    // Unmute with user gesture to satisfy browser autoplay security policies
    function toggleAudio() {
      const video = document.getElementById("remoteFeed");
      const btn = document.getElementById("unmuteBtn");

      if (video.muted) {
        video.muted = false;
        video.volume = 1.0;
        video.play().catch(() => {});
        btn.innerText = "🔇 Mute Audio";
        btn.style.background = "#34c759";
      } else {
        video.muted = true;
        btn.innerText = "🔊 Unmute Live Audio";
        btn.style.background = "#ff5252";
      }
    }

    // Creates a silent audio track so the WebRTC offer includes the audio channel
    function createSilentAudioStream() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const dst = ctx.createMediaStreamDestination();
      oscillator.connect(dst);
      oscillator.start();
      const track = dst.stream.getAudioTracks()[0];
      track.enabled = false; // Muted dummy track
      return track;
    }

    function connectLive() {
      const userChosenId = document.getElementById("targetCamId").value.trim().toLowerCase();
      const status = document.getElementById("status");
      const video = document.getElementById("remoteFeed");
      const videoBox = document.getElementById("videoBox");
      const btn = document.getElementById("connectBtn");

      if (!userChosenId) {
        alert("Please enter the Camera Name.");
        return;
      }

      localStorage.setItem("cctv_cam_name", userChosenId);

      const fullNetworkId = SECRET_PREFIX + userChosenId;
      btn.innerText = "Connecting...";
      status.innerText = "Reaching signaling server...";
      status.style.color = "#ffd60a";

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer();

      peer.on("open", () => {
        status.innerText = `Calling camera [${userChosenId}]...`;

        // Canvas dummy video track
        const canvas = document.createElement("canvas");
        canvas.width = 10; canvas.height = 10;
        const dummyStream = canvas.captureStream(5);

        // Crucial: Add a dummy audio track so WebRTC agrees to negotiate incoming audio
        try {
          dummyStream.addTrack(createSilentAudioStream());
        } catch (e) {
          console.warn("Could not attach silent audio track", e);
        }

        const call = peer.call(fullNetworkId, dummyStream);

        call.on("stream", (remoteStream) => {
          btn.innerText = "Connected";
          
          const audioTracks = remoteStream.getAudioTracks();
          if (audioTracks.length > 0) {
            status.innerText = "🔴 LIVE FEED ACTIVE (Video + Audio)";
          } else {
            status.innerText = "🔴 LIVE FEED ACTIVE (Video Only - No mic on camera)";
          }
          status.style.color = "#34c759";
          videoBox.style.display = "block";

          video.srcObject = remoteStream;
          video.muted = true; // Browser requires initial muted autoplay
          video.play().catch(() => {});
        });

        call.on("close", () => {
          btn.innerText = "Connect Live Stream";
          status.innerText = "Camera disconnected.";
          status.style.color = "#ff453a";
        });
      });

      peer.on("error", (err) => {
        btn.innerText = "Connect Live Stream";
        if (err.type === "peer-unavailable") {
          status.innerText = `Camera "${userChosenId}" is offline or still starting.`;
        } else {
          status.innerText = `Notice: ${err.type}`;
        }
        status.style.color = "#ff453a";
      });
    }

    // --- VAULT DECRYPTION LOGIC ---
    async function getCryptoKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function unlockAndPlay() {
      const fileInput = document.getElementById("filePicker");
      const password = document.getElementById("decryptPass").value;
      const status = document.getElementById("decryptStatus");
      const player = document.getElementById("vaultPlayer");

      if (!fileInput.files.length) {
        status.innerText = "Select an .enc file first.";
        return;
      }
      if (!password) {
        status.innerText = "Enter your vault password.";
        return;
      }

      status.innerText = "⏳ Decrypting in memory...";
      status.style.color = "#ffd60a";

      try {
        const file = fileInput.files[0];
        const buffer = await file.arrayBuffer();

        const salt = buffer.slice(0, 16);
        const iv = buffer.slice(16, 28);
        const ciphertext = buffer.slice(28);

        const key = await getCryptoKey(password, salt);
        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(iv) },
          key,
          ciphertext
        );

        const videoBlob = new Blob([decryptedBuffer], { type: "video/webm" });
        player.src = URL.createObjectURL(videoBlob);
        player.style.display = "block";
        player.play();

        status.innerText = "✅ Decrypted successfully!";
        status.style.color = "#34c759";
      } catch (err) {
        status.innerText = "❌ Incorrect password or corrupted file.";
        status.style.color = "#ff453a";
      }
    }
  </script>
</body>
</html>
